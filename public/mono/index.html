    <title>宽 API · 素境</title>
    <script>
      // 提前应用主题，避免首帧闪烁
      try {
        var saved = JSON.parse(localStorage.getItem('gpt-style-ui-v1') || '{}');
        var params = new URLSearchParams(location.search);
        var requested = params.get('embedded') === '1' ? params.get('appearance') : null;
        var theme = ['system', 'light', 'dark'].includes(requested) ? requested : saved.theme || 'system';
        document.documentElement.dataset.theme = theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
      } catch (e) {}
    </script>
